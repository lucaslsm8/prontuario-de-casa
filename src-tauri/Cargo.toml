[package]
name = "arquivo-saude"
version = "0.5.0"
description = "Arquivo de saúde da família"
authors = ["lucaslsm8"]
edition = "2021"

[lib]
name = "arquivo_saude_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SQLite compilado junto (sem dependências do sistema). Os dados vão cifrados pelo app.
rusqlite = { version = "0.32", features = ["bundled"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# Download da agenda do Google (endereço iCal que a pessoa colou).
ureq = "2"
# Atualização do APK: confere os endereços de download por parse (host e caminho do repositório).
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Rede de casa: só o hash SHA-256 do MAC/BSSID fica guardado.
sha2 = "0.10"
# Chave X25519 deste aparelho (a Task de remoção/rotação da chave da família a usa).
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Chave nova da família selada para cada aparelho (X25519 + HKDF-SHA256 + XChaCha20-Poly1305).
hkdf = "0.12"
# Sincronização direta pelo Wi-Fi: descoberta por mDNS e canal Noise (NNpsk0) com PSK da chave da família.
mdns-sd = "0.21"
snow = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }

# Chave do banco no cofre do sistema (Gerenciador de Credenciais no Windows, Keychain no macOS).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "apple-native"] }

# Notificações do Windows com botões (Tomei / 15 min / Pular).
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-registry = "0.6"

# Atualização pelo GitHub Releases (instalador assinado) e reinício depois de instalar. Só no desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# Biometria (digital/rosto) para abrir o app no celular; leitor de QR para o convite da família.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-biometric = "2"
tauri-plugin-barcode-scanner = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
