# Publica uma versão: ao enviar uma tag "v*" (ex.: v0.3.0), compila no Windows, assina
# e cria o release no GitHub com o instalador e o latest.json que o app instalado consulta.
# As notas (aviso de atualização no app) vêm de .github/notas-da-versao.md: edite antes de criar a tag.
#
# Precisa do segredo TAURI_SIGNING_PRIVATE_KEY (conteúdo de ~/.tauri/prontuario-de-casa.key)
# em Settings › Secrets and variables › Actions. Sem ele, o app não aceita a atualização.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - name: Notas da versão
        shell: bash
        run: |
          {
            echo 'NOTAS<<FIM'
            cat .github/notas-da-versao.md
            echo 'FIM'
          } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Prontuário de Casa ${{ github.ref_name }}
          releaseBody: ${{ env.NOTAS }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true

  # APK assinado, anexado ao mesmo rascunho de release criado pelo job "windows".
  # Precisa dos segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA (npm run android:chave).
  android:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Conferir segredos da assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_SENHA" ]; then
            echo "::error::Faltam os segredos ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_SENHA (rode npm run android:chave). Não publico APK sem assinatura."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Chave de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_SENHA: ${{ secrets.ANDROID_KEYSTORE_SENHA }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/prontuario.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/prontuario.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_SENHA"
          echo "ANDROID_KEYSTORE_SENHA=$KEYSTORE_SENHA" >> "$GITHUB_ENV"

      - run: npx tauri android build --apk

      - name: Enviar ao release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSAO="${TAG#v}"
          ORIGEM=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          if [ ! -f "$ORIGEM" ]; then
            echo "::error::APK assinado não encontrado em $ORIGEM"
            find src-tauri/gen/android/app/build/outputs -name '*.apk'
            exit 1
          fi
          APK="Prontuario.de.Casa_${VERSAO}_android.apk"
          cp "$ORIGEM" "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release upload "$TAG" "$APK" "$APK.sha256" --clobber --repo "$GITHUB_REPOSITORY"
